name: Legacy GDScript 权威写入审计

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  authority-audit:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证审计器反例
        shell: pwsh
        run: ./tools/audit_legacy_gdscript_authority.ps1 -SelfTest

      - name: 审计生产 GDScript
        shell: pwsh
        run: ./tools/audit_legacy_gdscript_authority.ps1
