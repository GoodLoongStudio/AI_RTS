<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d3557"/>
    </marker>
    <style>
      .title{font:700 42px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#152238}
      .sub{font:500 24px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#49566b}
      .box{fill:#f7fbff;stroke:#2f5f9f;stroke-width:2;rx:12}
      .decision{fill:#f7fbff;stroke:#2f5f9f;stroke-width:2}
      .panel{fill:#ffffff;stroke:#2f5f9f;stroke-width:2;rx:14}
      .panelhead{fill:#2f5f9f}
      .paneltitle{font:700 22px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#fff}
      .txt{font:500 20px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#162033}
      .small{font:500 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25324a}
      .tiny{font:500 15px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25324a}
      .line{stroke:#1d3557;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .plain{stroke:#1d3557;stroke-width:2.2;fill:none}
      .hint{font:600 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1d3557}
    </style>
  </defs>
  <rect width="1200" height="1500" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" class="title">RTS 战斗基础规则流程图</text>
  <text x="600" y="101" text-anchor="middle" class="sub">普通攻击战斗流程（精简主任务版）</text>

  <rect x="35" y="160" width="275" height="555" class="panel"/>
  <path d="M35 174 Q35 160 49 160 H296 Q310 160 310 174 V205 H35 Z" class="panelhead"/>
  <text x="172" y="190" text-anchor="middle" class="paneltitle">不同命令下的遇敌规则</text>
  <text x="58" y="240" class="txt">普通移动：</text><text x="58" y="270" class="small">继续移动，不自动进入战斗</text>
  <line x1="50" y1="292" x2="295" y2="292" stroke="#c8d3e0"/>
  <text x="58" y="330" class="txt">明确攻击：</text><text x="58" y="360" class="small">持续攻击指定目标</text>
  <line x1="50" y1="382" x2="295" y2="382" stroke="#c8d3e0"/>
  <text x="58" y="420" class="txt">攻击移动：</text><text x="58" y="450" class="small">临时战斗，结束后继续推进</text>
  <line x1="50" y1="472" x2="295" y2="472" stroke="#c8d3e0"/>
  <text x="58" y="510" class="txt">巡逻：</text><text x="58" y="540" class="small">临时战斗，结束后继续巡逻</text>
  <line x1="50" y1="562" x2="295" y2="562" stroke="#c8d3e0"/>
  <text x="58" y="600" class="txt">原地防守：</text><text x="58" y="630" class="small">只打当前位置内目标，不追击</text>
  <line x1="50" y1="652" x2="295" y2="652" stroke="#c8d3e0"/>
  <text x="58" y="690" class="txt">空闲：</text><text x="58" y="720" class="small">自动战斗受自动追击范围限制</text>

  <rect x="860" y="175" width="300" height="345" class="panel"/>
  <path d="M860 189 Q860 175 874 175 H1146 Q1160 175 1160 189 V220 H860 Z" class="panelhead"/>
  <text x="1010" y="205" text-anchor="middle" class="paneltitle">一次普通攻击</text>
  <rect x="885" y="255" width="58" height="72" class="box"/><text x="914" y="286" text-anchor="middle" class="tiny">攻击</text><text x="914" y="307" text-anchor="middle" class="tiny">前摇</text>
  <rect x="958" y="255" width="58" height="72" class="box"/><text x="987" y="286" text-anchor="middle" class="tiny">攻击</text><text x="987" y="307" text-anchor="middle" class="tiny">事件</text>
  <rect x="1031" y="255" width="58" height="72" class="box"/><text x="1060" y="286" text-anchor="middle" class="tiny">攻击</text><text x="1060" y="307" text-anchor="middle" class="tiny">后摇</text>
  <rect x="1104" y="255" width="42" height="72" class="box"/><text x="1125" y="286" text-anchor="middle" class="tiny">攻击</text><text x="1125" y="307" text-anchor="middle" class="tiny">间隔</text>
  <path d="M943 291 H958" class="line"/><path d="M1016 291 H1031" class="line"/><path d="M1089 291 H1104" class="line"/>
  <line x1="885" y1="355" x2="1138" y2="355" stroke="#c8d3e0"/>
  <text x="885" y="392" class="small">• 攻击事件前被打断：本次攻击取消</text>
  <text x="885" y="430" class="small">• 攻击事件后被打断：已发攻击仍有效</text>
  <text x="885" y="468" class="small">• 攻击事件是攻击成立的唯一分界点</text>

  <rect x="500" y="145" width="180" height="58" class="box"/><text x="590" y="181" text-anchor="middle" class="txt">获得攻击目标</text>
  <path d="M590 203 V245" class="line"/>
  <polygon points="590,235 730,300 590,365 450,300" class="decision"/><text x="590" y="290" text-anchor="middle" class="txt">是否处于</text><text x="590" y="319" text-anchor="middle" class="txt">可攻击位置？</text>
  <text x="612" y="391" class="hint">是</text><path d="M590 365 V430" class="line"/>
  <text x="742" y="285" class="hint">否</text><path d="M730 300 H800" class="line"/>
  <rect x="800" y="272" width="140" height="58" class="box"/><text x="870" y="308" text-anchor="middle" class="txt">接近目标</text>
  <path d="M870 330 V385" class="line"/>
  <polygon points="870,375 980,425 870,475 760,425" class="decision"/><text x="870" y="417" text-anchor="middle" class="small">已进入</text><text x="870" y="441" text-anchor="middle" class="small">可攻击位置？</text>
  <text x="886" y="500" class="hint">是</text><path d="M870 475 V530 H680" class="line"/>
  <text x="986" y="416" class="hint">否</text><path d="M980 425 H1025 V300 H940" class="line"/>

  <rect x="500" y="430" width="180" height="58" class="box"/><text x="590" y="466" text-anchor="middle" class="txt">攻击前摇</text>
  <path d="M590 488 V535" class="line"/>
  <polygon points="590,525 735,590 590,655 445,590" class="decision"/><text x="590" y="580" text-anchor="middle" class="small">攻击事件前</text><text x="590" y="605" text-anchor="middle" class="small">是否被新命令打断？</text>
  <text x="455" y="575" class="hint">是</text><path d="M445 590 H390 V720" class="line"/>
  <rect x="325" y="720" width="160" height="58" class="box"/><text x="405" y="756" text-anchor="middle" class="txt">本次攻击取消</text>
  <path d="M405 778 V825" class="line"/><rect x="325" y="825" width="160" height="58" class="box"/><text x="405" y="861" text-anchor="middle" class="txt">执行新命令</text>
  <text x="610" y="682" class="hint">否</text><path d="M590 655 V710" class="line"/>
  <rect x="500" y="710" width="180" height="58" class="box"/><text x="590" y="746" text-anchor="middle" class="txt">攻击事件发生</text>
  <path d="M590 768 V812" class="line"/><rect x="500" y="812" width="180" height="58" class="box"/><text x="590" y="848" text-anchor="middle" class="txt">攻击后摇</text>
  <path d="M590 870 V914" class="line"/><rect x="485" y="914" width="210" height="58" class="box"/><text x="590" y="950" text-anchor="middle" class="txt">等待下一次攻击</text>
  <path d="M590 972 V1017" class="line"/>
  <polygon points="590,1007 725,1067 590,1127 455,1067" class="decision"/><text x="590" y="1058" text-anchor="middle" class="small">当前目标</text><text x="590" y="1083" text-anchor="middle" class="small">仍然有效？</text>

  <text x="438" y="1052" class="hint">是</text><path d="M455 1067 H350" class="line"/>
  <polygon points="260,1037 350,1082 260,1127 170,1082" class="decision"/><text x="260" y="1075" text-anchor="middle" class="small">当前位置</text><text x="260" y="1098" text-anchor="middle" class="small">仍可攻击？</text>
  <text x="155" y="1060" class="hint">是</text><path d="M170 1082 H110 V455 H500" class="line"/>
  <text x="275" y="1150" class="hint">否</text><path d="M260 1127 V1170" class="line"/>
  <polygon points="260,1160 350,1205 260,1250 170,1205" class="decision"/><text x="260" y="1198" text-anchor="middle" class="small">当前行为</text><text x="260" y="1221" text-anchor="middle" class="small">允许追击？</text>
  <text x="155" y="1190" class="hint">是</text><path d="M170 1205 H105 V300 H800" class="line"/>
  <text x="275" y="1273" class="hint">否</text><path d="M260 1250 V1300 H485" class="line"/>

  <text x="738" y="1052" class="hint">否</text><path d="M725 1067 H800" class="line"/>
  <polygon points="900,1017 1015,1067 900,1117 785,1067" class="decision"/><text x="900" y="1075" text-anchor="middle" class="small">当前战斗来源？</text>
  <path d="M900 1117 V1165" class="plain"/>
  <path d="M660 1165 H1140" class="plain"/>
  <path d="M700 1165 V1200" class="line"/><path d="M810 1165 V1200" class="line"/><path d="M920 1165 V1200" class="line"/><path d="M1030 1165 V1200" class="line"/><path d="M1140 1165 V1200" class="line"/>
  <rect x="645" y="1200" width="110" height="50" class="box"/><text x="700" y="1232" text-anchor="middle" class="small">明确攻击</text>
  <rect x="755" y="1200" width="110" height="50" class="box"/><text x="810" y="1232" text-anchor="middle" class="small">攻击移动</text>
  <rect x="865" y="1200" width="110" height="50" class="box"/><text x="920" y="1232" text-anchor="middle" class="small">巡逻</text>
  <rect x="975" y="1200" width="110" height="50" class="box"/><text x="1030" y="1232" text-anchor="middle" class="small">原地防守</text>
  <rect x="1085" y="1200" width="110" height="50" class="box"/><text x="1140" y="1232" text-anchor="middle" class="small">空闲自动</text>
  <path d="M700 1250 V1290" class="line"/><path d="M810 1250 V1290" class="line"/><path d="M920 1250 V1290" class="line"/><path d="M1030 1250 V1290" class="line"/><path d="M1140 1250 V1290" class="line"/>
  <rect x="645" y="1290" width="110" height="50" class="box"/><text x="700" y="1322" text-anchor="middle" class="small">攻击结束</text>
  <rect x="755" y="1290" width="110" height="50" class="box"/><text x="810" y="1322" text-anchor="middle" class="small">继续推进</text>
  <rect x="865" y="1290" width="110" height="50" class="box"/><text x="920" y="1322" text-anchor="middle" class="small">继续巡逻</text>
  <rect x="975" y="1290" width="110" height="50" class="box"/><text x="1030" y="1322" text-anchor="middle" class="small">继续防守</text>
  <rect x="1085" y="1290" width="110" height="50" class="box"/><text x="1140" y="1322" text-anchor="middle" class="small">返回空闲</text>

  <rect x="60" y="1390" width="1080" height="80" fill="#f7fbff" stroke="#2f5f9f" stroke-width="2" rx="14"/>
  <text x="95" y="1425" class="hint">基础验收关注：</text>
  <text x="250" y="1425" class="small">普通移动遇敌不自动停下攻击；攻击移动战斗后继续原推进；</text>
  <text x="250" y="1452" class="small">原地防守不主动追击；攻击事件是一次攻击是否成立的唯一分界点。</text>
</svg>